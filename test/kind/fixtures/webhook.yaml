apiVersion: v1
kind: Service
metadata:
  name: demo-webhook
  namespace: demo
spec:
  ports:
    - name: https
      port: 443
      targetPort: 8443
---
# Matches events only, so installing it does not block the other fixtures.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: demo-webhook
webhooks:
  - name: demo.example.com
    failurePolicy: Fail
    sideEffects: None
    admissionReviewVersions: ["v1"]
    clientConfig:
      service:
        name: demo-webhook
        namespace: demo
        path: /validate
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["events"]
