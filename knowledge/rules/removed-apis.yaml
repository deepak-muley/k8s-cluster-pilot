    description: extensions/v1beta1 NetworkPolicy is no longer served as of Kubernetes 1.16.
    remediation: Migrate manifests and API clients to networking.k8s.io/v1, available since 1.8.
    parameters: {group: extensions, version: v1beta1, kinds: [NetworkPolicy], removedIn: "1.16", replacement: networking.k8s.io/v1}
    source: &guide {url: https://kubernetes.io/docs/reference/using-api/deprecation-guide/, title: Kubernetes Deprecated API Migration Guide, retrievedAt: "2026-11-09"}
    verification: official-documentation
    confidence: high

